<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>لوحة الأدمن — مهندس دولة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#050A14;--card:#0B1325;--card2:#101B33;--line:#17233F;--tx:#F1F5F9;--mu:#8793A8;--ac:#4C8DF6;--red:#F43F5E;--grn:#10B981;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;font:400 16px/1.7 'IBM Plex Sans Arabic',Tahoma,sans-serif;background:var(--bg);color:var(--tx)}
a{color:var(--ac);text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}h1,h2,h3,p{margin:0}
main{max-width:860px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 80px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}.top h1{font-size:22px;flex:1}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 16px;border-radius:12px;cursor:pointer}.btn:hover{border-color:var(--ac)}.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}.btn.d{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line))}.btn:disabled{opacity:.5;cursor:wait}
.card{border:1px solid var(--line);border-radius:20px;background:var(--card);padding:16px;margin-bottom:14px}.card h2{font-size:18px;margin-bottom:10px}
.st{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--mu)}.dot{width:10px;height:10px;border-radius:50%;background:var(--mu)}.dot.ok{background:var(--grn)}.dot.w{background:#F59E0B}
.list{display:flex;flex-direction:column;gap:8px}.row{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card2)}.row .g{flex:1;min-width:0}.row small{color:var(--mu)}
input[type=text],input[type=password],input[type=date],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;width:100%;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--ac)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;border:1px solid var(--line);border-radius:14px;background:var(--card);margin:12px 0}.seg button{border:0;background:none;padding:8px;border-radius:10px;color:var(--mu);cursor:pointer}.seg button[aria-pressed=true]{background:var(--card2);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.bar select{width:auto}
.it{display:flex;gap:12px;padding:10px;border:1px solid var(--line);border-radius:16px;background:var(--card2);margin-bottom:10px}.it .th{width:84px;height:112px;border-radius:12px;object-fit:cover;flex:none;background:var(--bg);display:grid;place-items:center;color:var(--mu);position:relative}
.it .th b{position:absolute;inset-block-end:4px;inset-inline-start:4px;background:rgba(5,10,20,.8);padding:0 8px;border-radius:99px;font-size:12px}
.it .f{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}.r{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.r>*{flex:1;min-width:110px}.r.b>*{flex:none;min-width:0;padding:5px 12px;font-size:14px}
.tag{font-size:12px;padding:0 10px;border-radius:99px;background:color-mix(in srgb,var(--grn) 18%,transparent);color:var(--grn)}.tag.no{background:color-mix(in srgb,#F59E0B 18%,transparent);color:#F59E0B}
label.k{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--mu);flex:none}
#toast{position:fixed;inset-inline:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);max-width:420px;margin:auto;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:14px;display:none;z-index:50;text-align:center}
#md{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;place-items:center;z-index:40;padding:16px}#md.on{display:grid}#md>div{width:100%;max-width:720px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}#md textarea{min-height:40vh;line-height:1.9}
.hint{color:var(--mu);font-size:14px}
</style></head><body><main id="app"></main><div id="toast"></div><div id="md"><div></div></div>
<script>
const $=s=>document.querySelector(s),esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let M=null,cur=null,tab='images',upCat='',pollT;
function toast(t,ms=2200){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',ms)}
async function api(p,b){const r=await fetch('/api/admin/'+p,{method:b===undefined?'GET':'POST',headers:{'Content-Type':'application/json','X-Admin':'1'},body:b===undefined?undefined:JSON.stringify(b)});const j=await r.json().catch(()=>({}));if(r.status==401&&p!=='login'){login();throw new Error(j.error||'')}if(!r.ok)throw new Error(j.error||'خطأ');return j}
async function load(keep){try{M=await api('manifest');}catch{return}clearTimeout(pollT);if(M.ocr.now.length||M.ocr.bulk.done<M.ocr.bulk.total)pollT=setTimeout(()=>load(true).then(()=>{if(!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)&&!$('#md').classList.contains('on'))render()}),3000);if(!keep)render()}
function login(msg){M=null;$('#app').innerHTML=`<div class="card" style="max-width:380px;margin:12vh auto"><h2>لوحة الأدمن</h2><p class="hint" style="margin-bottom:12px">للمالك فقط. الطلاب لا يحتاجون لأي تسجيل.</p><input type="password" id="pw" placeholder="كلمة السر" autocomplete="current-password"><p id="le" style="color:var(--red);min-height:26px;font-size:14px">${esc(msg||'')}</p><button class="btn p" id="go" style="width:100%">دخول</button></div>`;const go=async()=>{try{await api('login',{password:$('#pw').value});load()}catch(e){$('#le').textContent=e.message}};$('#go').onclick=go;$('#pw').onkeydown=e=>e.key=='Enter'&&go();$('#pw').focus()}
const cats=()=>M.categories,catSel=(v,all)=>`<select>${all?'<option value="">كل التصنيفات</option>':'<option value="">بلا تصنيف</option>'}${cats().map(c=>`<option value="${c.id}"${c.id==v?' selected':''}>${esc(c.name)}</option>`).join('')}</select>`;
function render(){if(!M)return;cur&&M.subjects.some(s=>s.slug==cur)?subj():home()}
function home(){cur=null;const s=M.storage,miss=M.subjects.reduce((a,x)=>a+x.images.filter(i=>!i.ocr).length,0),b=M.ocr.bulk;
$('#app').innerHTML=`<div class="top"><h1>لوحة الأدمن</h1><a class="btn" href="/" target="_blank">فتح الموقع</a><button class="btn" id="out">خروج</button></div>
<div class="card"><div class="st"><span class="dot ${s.backend=='none'||!s.ready||s.lastErr?'w':'ok'}"></span><span>${s.backend=='mongo'?(s.ready?'التخزين: MongoDB متصل ✓':'MongoDB غير متصل: لا يمكن الحفظ الآن'):s.backend=='github'?'التخزين: GitHub متصل':'لا يوجد تخزين دائم: التعديلات مؤقتة وتضيع عند إعادة تشغيل Render'}</span>${s.pending?`<span>· قيد الحفظ: ${s.pending}</span>`:''}${s.lastErr?`<span style="color:var(--red)">· خطأ: ${esc(s.lastErr)}</span>`:''}<span style="flex:1"></span>${s.pending?'<button class="btn p" id="fl">احفظ الآن</button>':''}</div>
<div class="st" style="margin-top:10px"><span class="dot ${M.ai.keys&&!M.ai.lastErr?'ok':'w'}"></span><span>${M.ai.keys?`Gemini: ${M.ai.keys} مفاتيح · النموذج: ${esc(M.ai.model||M.ai.models[0]||'')}`:'لا توجد مفاتيح Gemini (GEMINI_API_KEYS)'}</span><span style="flex:1"></span><button class="btn" id="ck">فحص Gemini</button></div>${M.ai.lastErr?`<p class="hint" style="color:#F59E0B;margin-top:6px;word-break:break-word">آخر خطأ: ${esc(M.ai.lastErr)}</p>`:''}<pre id="ckr" class="hint" style="white-space:pre-wrap;margin:8px 0 0;display:none"></pre>
${miss||b.total>b.done?`<div class="st" style="margin-top:10px"><span>صور بلا نص مستخرج: ${miss}</span>${b.total>b.done?`<span>· جارٍ القراءة ${b.done}/${b.total}</span>`:`<button class="btn" id="om">اقرأ نص الصور الناقصة</button>`}</div>`:''}</div>
<div class="card"><h2>المواد</h2><div class="list">${M.subjects.map((x,i)=>`<div class="row"><a class="g" href="#${x.slug}" data-s="${x.slug}"><b>${esc(x.name)}</b><br><small>${x.images.length} صورة · ${x.texts.length} ملف</small></a><button class="btn" data-mv="${x.slug}" data-d="-1" ${i?'':'disabled'}>↑</button><button class="btn" data-mv="${x.slug}" data-d="1" ${i<M.subjects.length-1?'':'disabled'}>↓</button></div>`).join('')||'<p class="hint">لا توجد مواد.</p>'}</div>
<div class="r" style="margin-top:12px;display:flex;gap:8px"><input type="text" id="ns" placeholder="اسم مادة جديدة"><button class="btn p" id="as" style="flex:none">إضافة مادة</button></div></div>
<div class="card"><h2>التمارين</h2><div class="list" id="exl">${(M.exercises||[]).map(e=>{const s=M.subjects.find(x=>x.slug===e.subject);return `<div class="row"><div class="g"><b>${esc(e.title)}</b><br><small>${s?esc(s.name):''}${e.due?' · تسليم '+esc(e.due):''}${e.remind?' · تذكير':''}</small></div><button class="btn" data-exe="${e.id}">تعديل</button><button class="btn d" data-exd="${e.id}">حذف</button></div>`}).join('')||'<p class="hint">لا توجد تمارين.</p>'}</div><button class="btn p" id="exa" style="margin-top:10px">إضافة تمرين</button></div>
<div class="card"><h2>الأجندة والتنبيهات</h2><div class="list" id="agl">${(M.agenda||[]).map(e=>`<div class="row"><div class="g"><b>${esc(e.title)}</b><br><small>${e.type}${e.date?' · '+esc(e.date):''}</small></div><button class="btn" data-age="${e.id}">تعديل</button><button class="btn d" data-agd="${e.id}">حذف</button></div>`).join('')||'<p class="hint">لا توجد أحداث.</p>'}</div><button class="btn p" id="aga" style="margin-top:10px">إضافة حدث</button></div>
<div class="card"><h2>التصنيفات (مثل COURS و TD و TP)</h2><div class="list" id="cl">${cats().map(c=>`<div class="row"><input type="text" value="${esc(c.name)}" data-id="${c.id}"><button class="btn d" data-dc="${c.id}">حذف</button></div>`).join('')}</div><div style="display:flex;gap:8px;margin-top:10px"><input type="text" id="nc" placeholder="تصنيف جديد، مثل: CORE"><button class="btn p" id="ac" style="flex:none">إضافة</button></div><p class="hint" style="margin-top:8px">تظهر للطلاب كأزرار تصفية داخل كل مادة، وحذف تصنيف لا يحذف العناصر.</p></div>`;
$('#out').onclick=async()=>{await api('logout',{});login()};if($('#fl'))$('#fl').onclick=async()=>{try{toast('جارٍ النشر…');await api('flush',{});await load();toast('تم')}catch(e){toast(e.message)}};$('#ck').onclick=async()=>{const b=$('#ck'),o=$('#ckr');b.disabled=true;o.style.display='block';o.textContent='جارٍ الفحص…';try{const r=await api('ai-check',{});o.textContent=`النماذج المضبوطة: ${r.models.join(' ، ')}${r.preferred?'\nالمستعمل حاليًا: '+r.preferred:''}${r.auto.length?'\nمكتشفة تلقائيًا: '+r.auto.join(' ، '):''}\n\n`+r.keys.map(k=>`مفتاح #${k.n}: ${k.list=='ok'?'اتصال سليم':'فشل الاتصال: '+k.list}\n${k.test}${k.models.length?'نماذج متاحة له: '+k.models.join(' ، ')+'\n':''}`).join('\n')}catch(e){o.textContent=e.message}b.disabled=false};
if($('#om'))$('#om').onclick=async()=>{const r=await api('ocr-missing',{});toast('بدأت قراءة '+r.count+' صورة');load()};
document.querySelectorAll('[data-s]').forEach(a=>a.onclick=e=>{e.preventDefault();cur=a.dataset.s;tab='images';render()});
document.querySelectorAll('[data-mv]').forEach(b=>b.onclick=async()=>{await api('subject-move',{subject:b.dataset.mv,dir:+b.dataset.d});load()});
$('#as').onclick=async()=>{const n=$('#ns').value.trim();if(!n)return;await api('subject-save',{name:n});load()};
const saveCats=async(list)=>{await api('settings-save',{categories:list});await load()};
$('#ac').onclick=()=>{const n=$('#nc').value.trim();if(n)saveCats([...cats(),{id:'c'+Date.now().toString(36),name:n}])};
document.querySelectorAll('[data-dc]').forEach(b=>b.onclick=()=>confirm('حذف هذا التصنيف؟')&&saveCats(cats().filter(c=>c.id!=b.dataset.dc)));
document.querySelectorAll('#cl input').forEach(i=>i.onchange=()=>saveCats(cats().map(c=>c.id==i.dataset.id?{...c,name:i.value.trim()||c.name}:c)).then(()=>toast('تم الحفظ')));
const exForm=(e={})=>{const m=$('#md');m.classList.add('on');m.firstElementChild.innerHTML=`<h2>${e.id?'تعديل تمرين':'تمرين جديد'}</h2><input type="text" id="ext" placeholder="عنوان التمرين" value="${esc(e.title||'')}"><select id="exs">${M.subjects.map(s=>`<option value="${s.slug}"${s.slug===e.subject?' selected':''}>${esc(s.name)}</option>`).join('')}</select><textarea id="exb" placeholder="نص التمرين (اختياري)">${esc(e.body||'')}</textarea><div style="display:flex;gap:8px;align-items:center"><input type="date" id="exd" value="${e.due?e.due.slice(0,10):''}" style="flex:1"><label class="k"><input type="checkbox" id="exr"${e.remind?' checked':''}> تذكير</label></div><div style="display:flex;gap:8px"><button class="btn p" id="exsave">حفظ</button><button class="btn" id="excc">إلغاء</button></div>`;$('#excc').onclick=()=>m.classList.remove('on');$('#exsave').onclick=async()=>{try{await api('exercise-save',{id:e.id,title:$('#ext').value,subject:$('#exs').value,body:$('#exb').value,due:$('#exd').value,remind:$('#exr').checked});m.classList.remove('on');await load();toast('تم الحفظ')}catch(err){toast(err.message)}}};
const agForm=(e={})=>{const m=$('#md');m.classList.add('on');m.firstElementChild.innerHTML=`<h2>${e.id?'تعديل حدث':'حدث جديد'}</h2><input type="text" id="agt" placeholder="العنوان (مثل: اختبار تحليل)" value="${esc(e.title||'')}"><select id="agty">${[['homework','واجب'],['exam','اختبار'],['tp','TP'],['other','أخرى']].map(([v,n])=>`<option value="${v}"${v===e.type?' selected':''}>${n}</option>`).join('')}</select><input type="date" id="agd" value="${e.date?e.date.slice(0,10):''}"><textarea id="agn" placeholder="ملاحظة (اختياري)">${esc(e.note||'')}</textarea><div style="display:flex;gap:8px"><button class="btn p" id="ags">حفظ</button><button class="btn" id="agc">إلغاء</button></div>`;$('#agc').onclick=()=>m.classList.remove('on');$('#ags').onclick=async()=>{try{await api('agenda-save',{id:e.id,title:$('#agt').value,type:$('#agty').value,date:$('#agd').value,note:$('#agn').value});m.classList.remove('on');await load();toast('تم الحفظ')}catch(err){toast(err.message)}}};
$('#exa').onclick=()=>exForm();
document.querySelectorAll('[data-exe]').forEach(b=>b.onclick=()=>exForm((M.exercises||[]).find(x=>x.id===b.dataset.exe)));
document.querySelectorAll('[data-exd]').forEach(b=>b.onclick=async()=>{if(confirm('حذف التمرين؟')){await api('exercise-delete',{id:b.dataset.exd});await load()}});
$('#aga').onclick=()=>agForm();
document.querySelectorAll('[data-age]').forEach(b=>b.onclick=()=>agForm((M.agenda||[]).find(x=>x.id===b.dataset.age)));
document.querySelectorAll('[data-agd]').forEach(b=>b.onclick=async()=>{if(confirm('حذف الحدث؟')){await api('agenda-delete',{id:b.dataset.agd});await load()}})}
function subj(){const s=M.subjects.find(x=>x.slug==cur),items=tab=='images'?s.images:s.texts;
$('#app').innerHTML=`<div class="top"><a href="#" id="bk">← كل المواد</a><h1 style="flex:1"></h1></div><div class="card"><div style="display:flex;gap:8px"><input type="text" id="sn" value="${esc(s.name)}"><button class="btn d" id="ds" style="flex:none">حذف المادة</button></div></div>
<div class="seg"><button data-t="images" aria-pressed="${tab=='images'}">الصور (${s.images.length})</button><button data-t="texts" aria-pressed="${tab=='texts'}">الملفات (${s.texts.length})</button></div>
<div class="bar">${tab=='images'?`<label class="btn p" style="cursor:pointer">رفع صور<input type="file" id="fi" accept="image/*" multiple hidden></label>`:`<label class="btn p" style="cursor:pointer">رفع ملف (txt / md / pdf)<input type="file" id="ft" accept=".txt,.md,.pdf" multiple hidden></label><button class="btn" id="nt">ملف نصي جديد</button>`}<input type="text" id="ur" placeholder="أو الصق رابط صورة" style="flex:1;min-width:150px"><button class="btn" id="ub">إضافة من رابط</button><span class="hint">التصنيف عند الرفع:</span><span id="uc">${catSel(upCat)}</span></div><p class="hint" id="pg" style="margin-bottom:8px"></p>
<div id="its">${items.map((x,i)=>item(s,x,i,items.length)).join('')||'<p class="hint">لا توجد عناصر بعد.</p>'}</div>`;
$('#bk').onclick=e=>{e.preventDefault();render0()};$('#uc select').onchange=e=>upCat=e.target.value;
$('#sn').onchange=async e=>{await api('subject-save',{slug:s.slug,name:e.target.value});toast('تم الحفظ');load(true)};
$('#ds').onclick=async()=>{if(confirm(`حذف مادة «${s.name}» بكل صورها وملفاتها نهائيًا؟`)&&confirm('تأكيد أخير: لا يمكن التراجع (إلا من سجل GitHub).')){await api('subject-delete',{subject:s.slug});cur=null;load()}};
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
if($('#ub'))$('#ub').onclick=async()=>{const u=$('#ur').value.trim();if(!u)return;$('#ub').disabled=true;$('#pg').textContent='جارٍ تحميل الصورة من الرابط…';try{const r=await api('fetch-url',{url:u}),bin=atob(r.data),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);const p=await prep(new Blob([arr],{type:r.mime}));await api('upload-image',{subject:s.slug,...p,cat:upCat,title:''});$('#ur').value='';toast('تمت إضافة الصورة');await load()}catch(e){toast(e.message,4000)}$('#ub').disabled=false;$('#pg').textContent=''};
if($('#fi'))$('#fi').onchange=e=>upImgs(s,[...e.target.files]);if($('#ft'))$('#ft').onchange=e=>upTexts(s,[...e.target.files]);if($('#nt'))$('#nt').onclick=()=>editor('ملف نصي جديد','',true,async(t,title)=>{await api('upload-text',{subject:s.slug,content:t,title,cat:upCat});await load()});
bindItems(s)}
const render0=()=>{cur=null;render()};
function item(s,x,i,n){const img=tab=='images',key=x.file,hasO=img&&x.ocr;
return`<div class="it" data-f="${esc(key)}" data-i="${i}"><div class="th">${img?`<img class="th" src="/${x.thumb}" alt="">`:(x.pdf?'PDF':'TXT')}<b>${i+1}</b></div><div class="f"><input type="text" class="t" placeholder="${img?'عنوان (اختياري)':'العنوان'}" value="${esc(x.title)}"><div class="r">${catSel(x.cat)}<input type="text" class="ch" placeholder="الفصل/الوحدة" value="${esc(x.chapter)}"></div><div class="r"><label class="k"><input type="checkbox" class="h"${x.hidden?' checked':''}> إخفاء عن الطلاب</label>${img?`<span class="tag ${hasO?'':'no'}">${hasO?'نص مستخرج ✓':(M.ocr.now.includes(s.slug+'/'+x.file)?'جارٍ القراءة…':'بلا نص')}</span>`:''}</div>
<div class="r b"><button class="btn" data-a="up" ${i?'':'disabled'}>↑</button><button class="btn" data-a="dn" ${i<n-1?'':'disabled'}>↓</button>${img?`<button class="btn" data-a="ocr">النص</button><button class="btn" data-a="rerun">إعادة قراءة</button><button class="btn" data-a="view">عرض</button>`:(x.pdf?`<button class="btn" data-a="view">عرض</button>`:`<button class="btn" data-a="edit">تعديل</button>`)}<button class="btn d" data-a="del">حذف</button></div></div></div>`}
function bindItems(s){const kind=tab,list=kind=='images'?s.images:s.texts;
document.querySelectorAll('.it').forEach(el=>{const x=list[+el.dataset.i],file=kind=='images'?x.file:x.name,base={subject:s.slug,kind,file};let tm;
 const save=()=>{clearTimeout(tm);tm=setTimeout(async()=>{try{await api('update-item',{...base,title:el.querySelector('.t').value,cat:el.querySelector('select').value,chapter:el.querySelector('.ch').value,hidden:el.querySelector('.h').checked});toast('تم الحفظ',1200);load(true)}catch(e){toast(e.message)}},500)};
 el.querySelectorAll('input,select').forEach(i=>i.addEventListener(i.type=='checkbox'||i.tagName=='SELECT'?'change':'input',save));
 el.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{const a=b.dataset.a;try{
  if(a=='up'||a=='dn'){await api('move-item',{...base,dir:a=='up'?-1:1});await load()}
  else if(a=='del'){if(confirm('حذف هذا العنصر نهائيًا؟')){await api('delete-item',base);await load()}}
  else if(a=='view')window.open('/'+(kind=='images'?x.src:x.file),'_blank')
  else if(a=='rerun'){await api('ocr-run',base);toast('بدأت قراءة الصورة');load()}
  else if(a=='ocr'){const t=x.ocr?await (await fetch('/'+x.ocr)).text():'';editor('النص المستخرج من الصورة (صحّح الأخطاء هنا)',t,false,async t=>{await api('ocr-save',{...base,text:t});await load()})}
  else if(a=='edit'){const t=await (await fetch('/'+x.file)).text();editor('تعديل: '+x.title,t,false,async t=>{await api('save-text',{...base,content:t});await load()})}
 }catch(e){toast(e.message)}})})}
function editor(title,text,withTitle,onSave){const m=$('#md');m.classList.add('on');m.firstElementChild.innerHTML=`<h2>${esc(title)}</h2>${withTitle?'<input type="text" id="et" placeholder="عنوان الملف">':''}<textarea id="ea"></textarea><div style="display:flex;gap:8px"><button class="btn p" id="es">حفظ</button><button class="btn" id="ec">إلغاء</button></div>`;$('#ea').value=text;
$('#ec').onclick=()=>m.classList.remove('on');$('#es').onclick=async()=>{$('#es').disabled=true;try{await onSave($('#ea').value,withTitle?$('#et').value:'');m.classList.remove('on');toast('تم الحفظ')}catch(e){toast(e.message);$('#es').disabled=false}}}
async function prep(file){const bm=await createImageBitmap(file,{imageOrientation:'from-image'});const sc=mx=>{const r=Math.min(1,mx/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=Math.round(bm.width*r);c.height=Math.round(bm.height*r);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);return c};
 const b64=(c,q)=>new Promise(r=>c.toBlob(bl=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(bl)},'image/jpeg',q));return{data:await b64(sc(2200),.85),thumb:await b64(sc(700),.8)}}
async function upImgs(s,fs){for(let i=0;i<fs.length;i++){$('#pg').textContent=`جارٍ رفع الصورة ${i+1} من ${fs.length}…`;try{const p=await prep(fs[i]);await api('upload-image',{subject:s.slug,...p,cat:upCat,title:''})}catch(e){toast('فشل رفع '+fs[i].name+': '+e.message,4000)}}$('#pg').textContent='';toast('تم الرفع. سيُقرأ نص الصور تلقائيًا.');await load()}
const b64f=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result.split(',')[1]);x.readAsDataURL(f)});
async function upTexts(s,fs){for(let i=0;i<fs.length;i++){$('#pg').textContent=`جارٍ رفع الملف ${i+1} من ${fs.length}…`;const f=fs[i],pdf=/\.pdf$/i.test(f.name),title=f.name.replace(/\.[^.]+$/,'');try{await api('upload-text',pdf?{subject:s.slug,pdf:1,data:await b64f(f),title,cat:upCat}:{subject:s.slug,content:await f.text(),title,cat:upCat})}catch(e){toast('فشل رفع '+f.name+': '+e.message,4000)}}$('#pg').textContent='';toast('تم الرفع');await load()}
load();
</script></body></html>
